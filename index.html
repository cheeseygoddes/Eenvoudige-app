<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4CAF50">
  <link rel="manifest" href="./manifest.json">
  <title>Task Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 20px; color: #333; max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #2e7d32; }
    .section { background: #fff; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 12px; color: #c62828; }
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .input-row input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .input-row button { padding: 10px 16px; border: none; border-radius: 8px; background: #4CAF50; color: #fff; cursor: pointer; }
    .task-list { list-style: none; padding: 0; }
    .task-list li { padding: 10px 14px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Task Planner</h1>
  <div class="section">
    <h2 style="color:#c62828">Must Do</h2>
    <div class="input-row">
      <input type="text" id="mustInput" placeholder="Add a task you must do...">
      <button onclick="addTask('must')">Add</button>
    </div>
    <ul class="task-list" id="mustList"></ul>
  </div>
  <div class="section">
    <h2 style="color:#1565c0">Want To Do</h2>
    <div class="input-row">
      <input type="text" id="wantInput" placeholder="Add a task you want to do...">
      <button onclick="addTask('want')">Add</button>
    </div>
    <ul class="task-list" id="wantList"></ul>
  </div>
  <script src="./app.js"></script>
</body>
</html>
