<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4CAF50">
  <link rel="manifest" href="./manifest.json">
  <title>Must Do / Want To Do</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 24px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); font-size: 1.8rem; }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .section { background: rgba(255,255,255,0.95); border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); backdrop-filter: blur(10px); transition: transform 0.2s; }
    .section:hover { transform: translateY(-2px); }
    .section h2 { font-size: 1.2rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .must-do h2 { color: #c62828; }
    .want-to-do h2 { color: #1565c0; }
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .input-row input { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; transition: border-color 0.2s; }
    .input-row input:focus { outline: none; border-color: #4CAF50; }
    .add-btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; background: #4CAF50; color: #fff; font-weight: 600; transition: background 0.2s, transform 0.1s; }
    .add-btn:hover { background: #388e3c; }
    .add-btn:active { transform: scale(0.97); }
    .bored-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; background: #1565c0; color: #fff; font-weight: 600; transition: background 0.2s; margin-bottom: 12px; }
    .bored-btn:hover { background: #0d47a1; }
    .bored-btn:disabled { background: #90caf9; cursor: not-allowed; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .task-list li { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #f8f9fa; border-radius: 10px; border: 1px solid #eee; transition: background 0.2s; }
    .task-list li:hover { background: #f0f0f0; }
    .task-list li .task-text { flex: 1; word-break: break-word; }
    .delete-btn { background: none; border: none; color: #e53935; cursor: pointer; font-size: 1.4rem; padding: 0 4px; opacity: 0.6; transition: opacity 0.2s; line-height: 1; }
    .delete-btn:hover { opacity: 1; }
    .empty-msg { color: #999; text-align: center; padding: 24px 0; font-style: italic; }
    .suggestion { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #e3f2fd; border-radius: 10px; border: 1px solid #90caf9; margin-bottom: 12px; }
    .suggestion-text { flex: 1; font-size: 0.95rem; color: #1565c0; word-break: break-word; }
    .suggestion-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .suggestion-yes, .suggestion-no { width: 36px; height: 36px; border: none; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
    .suggestion-yes { background: #4CAF50; color: #fff; }
    .suggestion-yes:hover { transform: scale(1.15); }
    .suggestion-no { background: #e53935; color: #fff; }
    .suggestion-no:hover { transform: scale(1.15); }
    .suggestion[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Must Do / Want To Do</h1>

    <div class="section must-do">
      <h2>&#128204; Must Do</h2>
      <div class="input-row">
        <input type="text" id="mustInput" placeholder="Add a task you must do...">
        <button class="add-btn" id="mustAddBtn">Add</button>
      </div>
      <ul class="task-list" id="mustList"></ul>
    </div>

    <div class="section want-to-do">
      <h2>&#127775; Want To Do</h2>
      <div class="input-row">
        <input type="text" id="wantInput" placeholder="Add a task you want to do...">
        <button class="add-btn" id="wantAddBtn">Add</button>
      </div>
      <button class="bored-btn" id="boredBtn">&#127922; I'm bored — suggest something!</button>
      <div id="suggestion" class="suggestion" hidden>
        <span class="suggestion-text" id="suggestionText"></span>
        <div class="suggestion-actions">
          <button class="suggestion-yes" id="suggestionYes">&#10003;</button>
          <button class="suggestion-no" id="suggestionNo">&#10007;</button>
        </div>
      </div>
      <ul class="task-list" id="wantList"></ul>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
