<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FF8A65">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title data-i18n="appTitle">Task Planner</title>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="lang-btn" id="langBtn">NL</button>
      <button class="lang-btn" id="themeBtn">Dark</button>
    </div>

    <div class="greeting">
      <h1 data-i18n="appTitle">App</h1>
      <div class="sub" id="greetingSub">Let's get stuff done</div>
    </div>

    <div class="section must-do">
      <div class="section-header">
        <h2><span data-i18n="mustDo">Must Do</span></h2>
        <button class="fab fab-must" data-modal="must">+</button>
      </div>
      <div class="filter-bar" id="mustFilters">
        <button class="filter-btn active" data-filter="all" data-i18n="all">All</button>
        <button class="filter-btn" data-filter="today" data-i18n="today">Today</button>
        <button class="filter-btn" data-filter="week" data-i18n="week">This Week</button>
        <button class="filter-btn" data-filter="month" data-i18n="month">This Month</button>
      </div>
      <div class="stats-bar" id="mustStats"></div>
      <ul class="task-list" id="mustList"></ul>
    </div>

    <div class="section want-to-do">
      <div class="section-header">
        <h2><span data-i18n="wantToDo">Want To Do</span></h2>
        <button class="fab fab-want" data-modal="want">+</button>
      </div>
      <div class="filter-bar" id="wantFilters">
        <button class="filter-btn active" data-filter="all" data-i18n="all">All</button>
        <button class="filter-btn" data-filter="today" data-i18n="today">Today</button>
        <button class="filter-btn" data-filter="week" data-i18n="week">This Week</button>
        <button class="filter-btn" data-filter="month" data-i18n="month">This Month</button>
      </div>
      <button class="bored-btn" id="boredBtn"><span data-i18n="bored">I'm bored — suggest something!</span></button>
      <div id="suggestion" class="suggestion" hidden>
        <span class="suggestion-text" id="suggestionText"></span>
        <div class="suggestion-actions">
          <button class="suggestion-yes" id="suggestionYes">&#10003;</button>
          <button class="suggestion-no" id="suggestionNo">&#10007;</button>
        </div>
      </div>
      <div class="stats-bar" id="wantStats"></div>
      <ul class="task-list" id="wantList"></ul>
    </div>
  </div>

  <!-- Add Task Modal -->
  <div class="modal-overlay" id="taskModal" hidden>
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 id="modalTitle" data-i18n="add">Add Task</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-form">
        <div>
          <label data-i18n="date">Date</label>
          <input type="date" id="modalDate">
        </div>
        <div>
          <label data-i18n="category">Category</label>
          <select id="modalCat"></select>
        </div>
        <div>
          <label data-i18n="description">Description</label>
          <input type="text" id="modalDesc" placeholder="e.g. Go for a run" data-i18n-placeholder="description">
        </div>
        <div class="form-row">
          <div>
            <label data-i18n="value">Value</label>
            <input type="number" id="modalVal" placeholder="0" min="0" step="1">
          </div>
        </div>
        <button class="modal-add-btn" id="modalAddBtn" data-i18n="add">Add</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
